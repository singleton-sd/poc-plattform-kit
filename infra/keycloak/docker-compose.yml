# Local / CI Keycloak for Platform Kit (does not talk to production).
# Usage:
#   docker compose -f infra/keycloak/docker-compose.yml up
# Then set KEYCLOAK_ISSUER=http://127.0.0.1:8080/realms/plattform-kit-test
# (see .env.example). Unit tests do not need this — they use a mock OIDC JWT.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ./realm-plattform-kit-test.json:/opt/keycloak/data/import/realm-plattform-kit-test.json:ro
