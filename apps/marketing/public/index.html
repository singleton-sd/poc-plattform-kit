<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platform Kit - Singleton SD</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1419;
        --fg: #f4f1ea;
        --muted: #a8a29e;
        --accent: #e8c547;
        --glow: rgba(232, 197, 71, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(ellipse 80% 60% at 50% -10%, var(--glow), transparent 55%),
          radial-gradient(circle at 85% 80%, rgba(68, 64, 60, 0.45), transparent 40%), var(--bg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: clamp(3rem, 12vh, 6rem) 1.5rem 3rem;
        text-align: center;
      }
      .brand {
        margin: 0 0 1.25rem;
        font-size: clamp(2.25rem, 7vw, 3.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      .brand span {
        color: var(--accent);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.15rem, 2.5vw, 1.35rem);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 2rem;
        color: var(--muted);
        line-height: 1.55;
        font-size: 1.05rem;
      }
      a.cta {
        display: inline-block;
        padding: 0.85rem 1.5rem;
        border-radius: 0.35rem;
        background: var(--accent);
        color: #1c1917;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      a.cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px var(--glow);
      }
      a.cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      footer {
        max-width: 40rem;
        margin: 0 auto;
        padding: 0 1.5rem 2.5rem;
        text-align: center;
      }
      footer nav {
        display: flex;
        justify-content: center;
        gap: 1.25rem;
        flex-wrap: wrap;
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.95rem;
      }
      footer a:hover {
        color: var(--accent);
      }
      footer a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Platform Kit<span>.</span></p>
      <h1>Multi-tenant platform foundations for Singleton SD</h1>
      <p>
        PoC surface for tenant, SSO, subscriptions, and related pillars — backed by Azure and
        designed for product teams shipping shared capabilities.
      </p>
      <a class="cta" href="https://app.plattform-kit.poc.singletonsd.com">Open the app</a>
    </main>
    <footer>
      <nav aria-label="Legal">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
      </nav>
    </footer>
  </body>
</html>
