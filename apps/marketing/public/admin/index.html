<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Admin — Platform Kit</title>
    <!-- Absolute path: at /admin (no trailing slash) a relative config.yml resolves to /config.yml. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Decap is a static admin SPA. It talks to GitHub, not Astro at runtime.
      GitHub OAuth requires a tiny proxy (follow-up ticket) before non-dev login works.
      Until then, edit Markdown under apps/marketing/src/content/ via git/PRs.
      Script must load after body exists — Decap mounts onto document.body.
    -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
