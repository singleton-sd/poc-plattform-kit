# Decap CMS — git-backed editor for marketing Markdown.
# Auth: GitHub backend needs an OAuth proxy (Azure Function follow-up).
# Docs: docs/marketing-astro-decap.md
backend:
  name: github
  repo: singleton-sd/poc-plattform-kit
  branch: main
  # Azure Function proxy (infra/decap-oauth.bicep → ssd-pocpk-decap-oauth-dev-ae)
  base_url: https://ssd-pocpk-decap-oauth-dev-ae.azurewebsites.net
  auth_endpoint: auth

# Prefer PRs so human merge still gates production publish.
publish_mode: editorial_workflow

logo:
  src: /admin/brand-mark.svg
  show_in_header: true

site_url: https://plattform-kit.poc.singletonsd.com
display_url: https://plattform-kit.poc.singletonsd.com

media_folder: apps/marketing/public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    folder: apps/marketing/src/content/pages
    create: false
    delete: false
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Brand, name: brand, widget: string, required: false }
      - { label: Headline, name: headline, widget: string, required: false }
      - { label: CTA label, name: ctaLabel, widget: string, required: false }
      - { label: CTA URL, name: ctaUrl, widget: string, required: false }
      - { label: Last updated, name: updated, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
