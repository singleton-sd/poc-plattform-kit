<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>poc-plattform-kit</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4f1;
        --fg: #1c1917;
        --muted: #57534e;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, #e7e5e4, transparent 45%),
          radial-gradient(circle at 80% 0%, #d6d3d1, transparent 40%), var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>poc-plattform-kit</h1>
      <p>Web stub for SWA PR previews. Next.js PWA SPA lands via foundation tickets.</p>
    </main>
  </body>
</html>
