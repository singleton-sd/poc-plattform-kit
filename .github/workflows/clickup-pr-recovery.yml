name: Recover ClickUp PR handoffs

on:
  workflow_run:
    workflows:
      - PR hygiene
      - PR handoff gate
      - CI Web
      - CI API
      - Preview Web (SWA)
      - Preview Marketing (SWA)
      - Preview API (Container Apps)
    types: [completed]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  id-token: write

jobs:
  recover:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    concurrency:
      # Main pushes share a stable ref key so a newer global scan supersedes an
      # older one. Unassociated workflow runs fall back to their unique run id.
      group: clickup-pr-recovery-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted recovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Recover unsafe ClickUp handoffs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x scripts/recover-clickup-pr.sh ]; then
            echo 'Recovery implementation is being bootstrapped by this PR; defer until merged.'
            exit 0
          fi
          CLICKUP_API_TOKEN=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name clickup-api-token \
            --query value -o tsv)
          echo "::add-mask::$CLICKUP_API_TOKEN"
          export CLICKUP_API_TOKEN

          # Give PR hygiene time to apply labels for a newly-created comment.
          case "$EVENT_NAME" in
            issue_comment|pull_request_review|pull_request_review_comment) sleep 15 ;;
          esac

          if [ -n "${EVENT_PR:-}" ] && [ "$EVENT_PR" != null ]; then
            PR_NUMBER="$EVENT_PR" ./scripts/recover-clickup-pr.sh
          else
            gh pr list --state open --limit 100 --json number --jq '.[].number' | while read -r PR; do
              PR_NUMBER="$PR" ./scripts/recover-clickup-pr.sh
            done
          fi
