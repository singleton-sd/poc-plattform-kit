# Legacy — ClickUp-tracked tickets only (docs/github-source-of-truth.md section 9).
# GitHub-native issues have no ClickUp status to recover: scripts/recover-clickup-pr.sh
# no-ops for branches that aren't `feature/<clickup-id>-...` / `hotfix/<clickup-id>-...`.
# For GitHub-native PRs the equivalent "recovery" is already handled reactively by
# pr-hygiene.yml, which keeps needs-rebase/ci-failed/has-feedback/ready-for-human in
# sync with PR state on every relevant event — no separate recovery job is needed.
# This workflow stays only to finish out ClickUp Delivery tickets in flight until
# docs/github-source-of-truth.md section 8 issues #177/#178 land.
name: Recover ClickUp PR handoffs

on:
  pull_request:
    types: [labeled, unlabeled]
  workflow_run:
    workflows:
      - CI Web
      - CI API
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  id-token: write

jobs:
  recover:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["ci-failed","has-feedback","needs-rebase"]'), github.event.label.name)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    concurrency:
      group: clickup-pr-recovery-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted recovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Recover unsafe ClickUp handoffs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x scripts/recover-clickup-pr.sh ]; then
            echo 'Recovery implementation is being bootstrapped by this PR; defer until merged.'
            exit 0
          fi
          CLICKUP_API_TOKEN=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name clickup-api-token \
            --query value -o tsv)
          echo "::add-mask::$CLICKUP_API_TOKEN"
          export CLICKUP_API_TOKEN

          if [ -n "${EVENT_PR:-}" ] && [ "$EVENT_PR" != null ]; then
            PR_NUMBER="$EVENT_PR" ./scripts/recover-clickup-pr.sh
          else
            gh pr list --state open --limit 100 --json number --jq '.[].number' | while read -r PR; do
              PR_NUMBER="$PR" ./scripts/recover-clickup-pr.sh
            done
          fi
