name: Complete ClickUp ticket on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  complete-clickup-ticket:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Clear hygiene labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --remove-label needs-rebase \
            --remove-label ci-failed \
            --remove-label has-feedback \
            --remove-label preview-blocked || true

      - name: Complete linked ClickUp ticket
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          CLICKUP_API_TOKEN=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name clickup-api-token \
            --query value -o tsv)
          echo "::add-mask::$CLICKUP_API_TOKEN"
          export CLICKUP_API_TOKEN
          ./scripts/complete-clickup-on-merge.sh
