# GitHub Pages — marketing production deploy on merge to main (content
# changes), after Release dispatches this workflow for a marketing tag
# (release_tag + release_sha), or manual dispatch. Custom
# domain: plattform-kit.poc.singletonsd.com.
# Follows the house pattern in singleton-sd/poc-inkads-marketing (gh-pages
# branch + CNAME + clean-exclude pr-preview). Do not enable a second Pages
# site in this repo — GitHub allows only one.
#
# Auth: GITHUB_TOKEN only. GitHub Pages is not an Azure resource, so the
# OIDC → Key Vault production pattern does not apply (product app SWA and
# API still use OIDC). Required Variable PUBLIC_TURNSTILE_SITE_KEY bakes
# the Cloudflare Turnstile site key into contact/waitlist widgets.
name: Deploy Marketing (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/pages.yml'
      - '.github/workflows/preview-marketing.yml'
      - '.github/workflows/preview-marketing-close.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA the marketing tag points at (optional)
        required: false
        type: string
      release_tag:
        description: Marketing package tag (e.g. @poc-plattform-kit/marketing@0.10.0)
        required: false
        type: string

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    name: Build + GitHub Pages production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.inputs.release_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: true
          lfs: false

      - name: Verify release tag matches SHA
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag && inputs.release_sha
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          set -euo pipefail
          tag_sha=$(git rev-parse --verify "${RELEASE_TAG}^{commit}")
          want=$(git rev-parse --verify "${RELEASE_SHA}^{commit}")
          if [ "$tag_sha" != "$want" ]; then
            echo "::error::$RELEASE_TAG points at $tag_sha, not $RELEASE_SHA"
            exit 1
          fi

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require Turnstile site key
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::error::PUBLIC_TURNSTILE_SITE_KEY is not set. The lead forms cannot submit without it."
            exit 1
          fi

      - name: Build marketing
        env:
          PUBLIC_POSTKIT_API_BASE_URL: ${{ vars.PUBLIC_POSTKIT_API_BASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm --filter @poc-plattform-kit/marketing... run build

      - name: Check asset paths (root)
        run: node apps/marketing/scripts/check-asset-paths.mjs --dir apps/marketing/dist --base /

      - name: Deploy production site
        id: deploy
        continue-on-error: true
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: apps/marketing/dist
          clean: true
          clean-exclude: pr-preview
          # Emit .nojekyll so Pages does not hide Astro `_astro/` assets.
          jekyll: true

      - name: Retry production deploy
        if: steps.deploy.outcome == 'failure'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: apps/marketing/dist
          clean: true
          clean-exclude: pr-preview
          jekyll: true
