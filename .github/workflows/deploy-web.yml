# Azure Static Web Apps — production deploy on package tag push, or
# workflow_dispatch with release_tag + release_sha (Release dispatches only
# when it actually tagged this package). The SWA build embeds
# NEXT_PUBLIC_APP_VERSION from the `@poc-plattform-kit/web@*` tag (package.json
# on the tagged commit is bumped in the same release). Always checks out the
# tagged commit.
# Secrets: NEVER in GitHub Secrets. OIDC → Key Vault `swa-deployment-token`.
# Required Variables (IDs only): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# If those Variables are missing, deploy steps SKIP (job succeeds) so main CI is not blocked.
# See SETUP.md / docs/pr-pipelines.md.
name: Deploy Web (SWA production)

on:
  push:
    tags:
      - '@poc-plattform-kit/web@*'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA the tag points at (resolved from release_tag when omitted)
        required: false
        type: string
      release_tag:
        description: Package tag to deploy (e.g. @poc-plattform-kit/web@0.18.0)
        required: false
        type: string

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build + SWA production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.inputs.release_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: true
          lfs: false

      - name: Resolve release version
        id: rel
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -z "${RELEASE_TAG:-}" ] && [ -z "${RELEASE_SHA:-}" ]; then
            echo "::error::workflow_dispatch requires release_tag and/or release_sha"
            exit 1
          fi
          args=(--package '@poc-plattform-kit/web')
          if [ -n "${RELEASE_TAG:-}" ]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          if [ -n "${RELEASE_SHA:-}" ]; then
            args+=(--sha "$RELEASE_SHA")
          fi
          node scripts/resolve-release-tag.mjs "${args[@]}"

      - name: Check out the tagged commit
        if: steps.rel.outputs.found == 'true' && steps.rel.outputs.sha != ''
        run: |
          set -euo pipefail
          target=$(git rev-parse --verify "${{ steps.rel.outputs.sha }}^{commit}")
          current=$(git rev-parse HEAD)
          if [ "$current" != "$target" ]; then
            echo "HEAD $current → tagged commit $target"
            git checkout --detach "$target"
          fi

      - name: Skip notice (no web tag)
        if: steps.rel.outputs.found != 'true'
        run: echo "No @poc-plattform-kit/web@* tag at this commit — skipping production deploy."

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.rel.outputs.found == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.rel.outputs.found == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.rel.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web
        if: steps.rel.outputs.found == 'true'
        env:
          # Baked into the static export; SWA runtime cannot inject this later.
          # Option B cookies on custom domains; MSAL Bearer on *.azurestaticapps.net.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.plattform-kit.poc.singletonsd.com' }}
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}
          NEXT_PUBLIC_AZURE_AD_API_SCOPE: ${{ vars.NEXT_PUBLIC_AZURE_AD_API_SCOPE }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.rel.outputs.version }}
        run: pnpm --filter @poc-plattform-kit/web... run build

      - name: Check OIDC Variables
        if: steps.rel.outputs.found == 'true'
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) — skipping SWA production deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.rel.outputs.found == 'true' && steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read SWA deploy token from Key Vault
        if: steps.rel.outputs.found == 'true' && steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          token=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name swa-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy SWA production
        id: deploy
        if: steps.rel.outputs.found == 'true' && steps.oidc.outputs.configured == 'true' && env.SWA_DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ env.SWA_DEPLOYMENT_TOKEN }}
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          # Next `output: 'export'` emits under apps/web/out
          app_location: apps/web/out
          skip_app_build: true
          # Push to main → production environment (not a PR staging URL)
          production_branch: main

      - name: Skip notice (OIDC not configured)
        if: steps.rel.outputs.found == 'true' && steps.oidc.outputs.configured != 'true'
        run: |
          echo "SWA production deploy skipped — set GitHub Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC IDs only; token stays in Key Vault)."
