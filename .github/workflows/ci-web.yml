name: CI Web
# includes marketing Astro SSG

# Path filters include this workflow file so edits re-run web CI on PRs.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/marketing/**'
      - 'apps/marketing-oauth/**'
      - 'packages/**'
      - 'scripts/validate-staticwebapp-config.mjs'
      - 'scripts/validate-staticwebapp-config.test.mjs'
      - 'scripts/check-client-changelogs.mjs'
      - 'scripts/check-client-changelogs.test.mjs'
      - 'scripts/client-changelog.mjs'
      - 'scripts/client-changelog.test.mjs'
      - 'scripts/backfill-client-changelogs.mjs'
      - 'scripts/backfill-client-changelogs.test.mjs'
      - 'scripts/worktree-paths.mjs'
      - 'scripts/worktree-paths.test.mjs'
      - '.github/workflows/ci-web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierrc'
      - '.prettierignore'
      - 'eslint.config.js'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/marketing/**'
      - 'apps/marketing-oauth/**'
      - 'packages/**'
      - 'scripts/validate-staticwebapp-config.mjs'
      - 'scripts/validate-staticwebapp-config.test.mjs'
      - 'scripts/check-client-changelogs.mjs'
      - 'scripts/check-client-changelogs.test.mjs'
      - 'scripts/client-changelog.mjs'
      - 'scripts/client-changelog.test.mjs'
      - 'scripts/backfill-client-changelogs.mjs'
      - 'scripts/backfill-client-changelogs.test.mjs'
      - 'scripts/worktree-paths.mjs'
      - 'scripts/worktree-paths.test.mjs'
      - '.github/workflows/ci-web.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierrc'
      - '.prettierignore'
      - 'eslint.config.js'

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint / format / build (web)
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !startsWith(github.event.head_commit.message, 'chore: Release'))
    runs-on: ubuntu-latest
    env:
      # prisma validate/generate read schema url; no live DB in CI
      DATABASE_URL: 'sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: Changelog projection drift check
        run: pnpm changelog:test && pnpm changelog:check && pnpm test:worktree-paths

      - name: Lint (web + marketing + packages)
        run: |
          pnpm --filter @poc-plattform-kit/web... run lint
          pnpm --filter @poc-plattform-kit/marketing... run lint
          pnpm --filter @poc-plattform-kit/marketing-oauth... run lint
          pnpm exec eslint .

      - name: Build (web + marketing + packages)
        run: |
          pnpm --filter @poc-plattform-kit/web... run build
          pnpm --filter @poc-plattform-kit/web run build-storybook
          pnpm --filter @poc-plattform-kit/marketing... run build
          pnpm --filter @poc-plattform-kit/marketing-oauth... run build
          pnpm --filter "./packages/**" run build

      - name: Test (web + marketing + packages)
        run: |
          pnpm --filter @poc-plattform-kit/web... run test
          pnpm --filter @poc-plattform-kit/marketing... run test
          pnpm --filter @poc-plattform-kit/marketing-oauth... run test
          pnpm --filter "./packages/**" run test
