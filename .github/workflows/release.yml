# Path-aware release-it: bump workspace package versions on main.
# Skips when the push is already a release commit (avoids loops).
# Branch protection requires a PR — release:ci pushes chore/release-package-versions,
# this workflow opens/merges that PR, pushes tags, then dispatches deploy workflows.
# GITHUB_TOKEN pushes do not trigger other workflows (GitHub recursion guard).
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: Release') }}"
    runs-on: ubuntu-latest
    name: Bump package versions
    # Placeholder URL for Prisma generate during openapi:export (no live DB).
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true'
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release branch pushed:' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(grep '^Release commit: ' "$tmp" | tail -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
            echo "tags=$(grep '^Release tags: ' "$tmp" | tail -1 | sed 's/^Release tags: //')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no release branch push and not empty)."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge release PR
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: chore/release-package-versions
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH" main
          pr=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: Release package versions" \
              --body "Automated release from [\`release.yml\`](https://github.com/${{ github.repository }}/actions/workflows/release.yml).")
          fi
          echo "Waiting for required checks on PR #$pr..."
          gh pr checks "$pr" --watch --fail-fast
          gh pr merge "$pr" --merge --delete-branch
          git fetch origin main --tags
          git reset --hard origin/main

      - name: Push release tags
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2206
          tags=(${RELEASE_TAGS//,/ })
          node scripts/release-changed.mjs --push-tags "$RELEASE_SHA" "${tags[@]}"

      - name: Dispatch production deploys
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          echo "Release commit $RELEASE_SHA on main — files:"
          mapfile -t files < <(git show --name-only --pretty=format: "$RELEASE_SHA")
          printf '%s\n' "${files[@]}"
          dispatch=false
          for f in "${files[@]}"; do
            if [ "$f" = 'apps/api/package.json' ]; then
              echo "Dispatching deploy-api.yml @ main ($RELEASE_SHA)"
              gh workflow run deploy-api.yml --ref main
              dispatch=true
            fi
            if [ "$f" = 'apps/web/package.json' ]; then
              echo "Dispatching deploy-web.yml @ main ($RELEASE_SHA)"
              gh workflow run deploy-web.yml --ref main
              dispatch=true
            fi
            if [ "$f" = 'apps/marketing/package.json' ]; then
              echo "Dispatching deploy-marketing.yml @ main ($RELEASE_SHA)"
              gh workflow run deploy-marketing.yml --ref main
              dispatch=true
            fi
          done
          if [ "$dispatch" = false ]; then
            echo "No deployable app package.json in release commit — skipping deploys."
          fi
