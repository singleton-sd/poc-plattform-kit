# Path-aware tag-only releases on merge to main.
# Computes the next per-package semver in memory from the latest
# `@scope/name@version` git tag plus conventional commits since then,
# pushes ONLY those tags, and publishes a GitHub Release per tag.
#
# Never commits or pushes to the default branch (no version-bump or
# CHANGELOG commits). Uses GITHUB_TOKEN only — no PAT, no ruleset bypass.
# Branch rulesets target `refs/heads/main` / ~DEFAULT_BRANCH and do not
# apply to tags; do not add a tag ruleset that requires a pull request.
#
# GITHUB_TOKEN tag pushes do not trigger other workflows, so this job
# dispatches deploy-api / deploy-web / pages via workflow_dispatch only
# for packages it actually tagged, passing release_tag AND release_sha.
# Tagless runs never enter those deploy concurrency groups.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !startsWith(github.event.head_commit.message, 'chore: Release'))
    runs-on: ubuntu-latest
    name: Tag changed packages
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure git identity for annotated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          sha=$(grep '^RELEASE_SHA=' "$tmp" | tail -1 | cut -d= -f2- || true)
          echo "release_sha=$sha" >> "$GITHUB_OUTPUT"
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release tags pushed' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            tags=$(grep '^RELEASE_TAGS=' "$tmp" | tail -1 | cut -d= -f2-)
            if [ -z "$tags" ]; then
              echo "::error::Release succeeded but RELEASE_TAGS line was missing from release:ci output."
              exit 1
            fi
            echo "release_tags=$tags" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no tag push and not empty)."
          exit 1

      - name: Reconcile GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAGS: ${{ steps.release.outputs.release_tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(node scripts/release-changed.mjs --reconcile-tags)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No package tags to reconcile."
            exit 0
          fi
          for tag in "${tags[@]}"; do
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            [ -n "$tag" ] || continue
            echo "Reconciling GitHub Release for $tag"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists — skipping."
              continue
            fi
            gh release create "$tag" \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          done

      - name: Dispatch production deploys
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAGS: ${{ steps.release.outputs.release_tags }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SHA:-}" ]; then
            echo "::error::RELEASE_SHA missing; cannot dispatch deploys."
            exit 1
          fi
          IFS=',' read -r -a tags <<< "$RELEASE_TAGS"
          dispatched=0
          for tag in "${tags[@]}"; do
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            [ -n "$tag" ] || continue
            workflow=""
            case "$tag" in
              @poc-plattform-kit/api@*) workflow=deploy-api.yml ;;
              @poc-plattform-kit/web@*) workflow=deploy-web.yml ;;
              @poc-plattform-kit/marketing@*) workflow=pages.yml ;;
              *)
                echo "No production deploy workflow for $tag — GitHub Release only."
                continue
                ;;
            esac
            echo "Dispatching $workflow for $tag at $RELEASE_SHA"
            gh workflow run "$workflow" --ref main \
              -f "release_tag=$tag" \
              -f "release_sha=$RELEASE_SHA"
            dispatched=$((dispatched + 1))
          done
          echo "Dispatched $dispatched production deploy workflow(s)."
