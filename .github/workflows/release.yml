# Path-aware release-it: bump workspace package versions on main.
# Skips when the push is already a release commit (avoids loops).
# Git push uses the org-wide platform automation PAT from devtools Key Vault
# (OIDC). Vault: ssd-devtools-kv-prod-ae / secret github-automation-pat.
# Same vault + secret name across all singleton-sd repos — see SETUP.md.
# PAT owner must be on the main ruleset bypass list (User, Always bypass).
# After a bump, explicitly dispatch the affected production deploy workflows —
# GITHUB_TOKEN pushes do not trigger other workflows (GitHub recursion guard).
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # Org-locked singleton-sd constants — copy release.yml unchanged into other repos.
  SSD_OPS_KEY_VAULT_NAME: ssd-devtools-kv-prod-ae
  SSD_OPS_KEY_VAULT_SUBSCRIPTION_ID: 01c0bb8b-3770-4765-979a-cb13ae7e3dd2
  SSD_GITHUB_AUTOMATION_PAT_SECRET: github-automation-pat

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: Release') }}"
    runs-on: ubuntu-latest
    name: Bump package versions
    # Placeholder URL for Prisma generate during openapi:export (no live DB).
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true'
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require Azure OIDC Variables
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Variable $name. Release requires OIDC — see SETUP.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stage platform automation PAT from devtools Key Vault
        id: automation_pat
        run: |
          set -euo pipefail
          vault_uri="https://${SSD_OPS_KEY_VAULT_NAME}.vault.azure.net"
          secret_uri="${vault_uri}/secrets/${SSD_GITHUB_AUTOMATION_PAT_SECRET}/?api-version=7.4"
          # Cross-subscription: OIDC login uses the app subscription. Data-plane REST
          # + Key Vault Secrets User on the vault avoids needing subscription access.
          err_file="$RUNNER_TEMP/kv-pat.err"
          if ! pat=$(az rest \
            --method GET \
            --uri "$secret_uri" \
            --resource "https://vault.azure.net" \
            --query value \
            -o tsv 2>"$err_file"); then
            echo "::error::Failed to read $SSD_GITHUB_AUTOMATION_PAT_SECRET from $SSD_OPS_KEY_VAULT_NAME."
            if grep -Eiq 'Forbidden|403|AuthorizationFailed|Access denied|KeyVaultAccessForbidden|does not have.*secret get' "$err_file"; then
              echo "Grant this repo's OIDC service principal Key Vault Secrets User on the devtools vault (cross-subscription RBAC — subscription Reader is not required). See SETUP.md."
            else
              echo "Check vault name, secret name, network/firewall, and that $SSD_GITHUB_AUTOMATION_PAT_SECRET exists. See SETUP.md."
            fi
            cat "$err_file" >&2
            exit 1
          fi
          if [ -z "$pat" ]; then
            echo "::error::Key Vault secret $SSD_GITHUB_AUTOMATION_PAT_SECRET in $SSD_OPS_KEY_VAULT_NAME is empty. Follow SETUP.md."
            exit 1
          fi
          echo "::add-mask::$pat"
          pat_file="$RUNNER_TEMP/github-automation-pat"
          printf '%s' "$pat" > "$pat_file"
          chmod 600 "$pat_file"
          echo "pat_file=$pat_file" >> "$GITHUB_OUTPUT"
        env:
          SSD_OPS_KEY_VAULT_SUBSCRIPTION_ID: ${{ env.SSD_OPS_KEY_VAULT_SUBSCRIPTION_ID }}
          SSD_OPS_KEY_VAULT_NAME: ${{ env.SSD_OPS_KEY_VAULT_NAME }}
          SSD_GITHUB_AUTOMATION_PAT_SECRET: ${{ env.SSD_GITHUB_AUTOMATION_PAT_SECRET }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Release changed packages
        id: release
        run: |
          set -euo pipefail
          pat_file="${{ steps.automation_pat.outputs.pat_file }}"
          origin_url="https://github.com/${{ github.repository }}.git"
          cleanup() {
            git remote set-url origin "$origin_url"
            rm -f "$pat_file"
          }
          trap cleanup EXIT

          pat=$(<"$pat_file")
          user_json=$(curl -sf \
            -H "Authorization: bearer $pat" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)
          login=$(echo "$user_json" | jq -r '.login')
          user_id=$(echo "$user_json" | jq -r '.id')
          if [ -z "$login" ] || [ "$login" = null ] || [ -z "$user_id" ] || [ "$user_id" = null ]; then
            echo "::error::Could not resolve platform automation user from PAT (check token Metadata + Contents permissions)."
            exit 1
          fi
          git config user.name "$login"
          git config user.email "${user_id}+${login}@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${pat}@github.com/${{ github.repository }}.git"
          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release commit and tags pushed' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no release push and not empty)."
          exit 1

      - name: Dispatch production deploys
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SHA" ]; then
            echo "::error::Missing release_sha output from release step."
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" fetch origin main --tags
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release SHA ($RELEASE_SHA) does not match origin/main ($MAIN_SHA) after release push."
            exit 1
          fi
          mapfile -t files < <(git show --name-only --pretty=format: "$RELEASE_SHA")
          echo "Release commit $RELEASE_SHA on main — files:"
          printf '%s\n' "${files[@]}"
          dispatch=false
          for f in "${files[@]}"; do
            if [ "$f" = 'apps/api/package.json' ]; then
              echo "Dispatching deploy-api.yml @ $RELEASE_SHA"
              gh workflow run deploy-api.yml --ref main -f release_sha="$RELEASE_SHA"
              dispatch=true
            fi
            if [ "$f" = 'apps/web/package.json' ]; then
              echo "Dispatching deploy-web.yml @ $RELEASE_SHA"
              gh workflow run deploy-web.yml --ref main -f release_sha="$RELEASE_SHA"
              dispatch=true
            fi
            if [ "$f" = 'apps/marketing/package.json' ]; then
              echo "Dispatching deploy-marketing.yml @ $RELEASE_SHA"
              gh workflow run deploy-marketing.yml --ref main -f release_sha="$RELEASE_SHA"
              dispatch=true
            fi
          done
          if [ "$dispatch" = false ]; then
            echo "No deployable app package.json in release commit — skipping deploys."
          fi
