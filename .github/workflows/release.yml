# Path-aware independent releases. Bumps each workspace package that has
# releasable conventional commits since its last @scope/name@version tag,
# commits version bumps + CHANGELOG.md as
# "chore(release): Release package versions [skip ci]", tags, and pushes
# to main. The singleton-release GitHub App (vars.RELEASE_APP_ID +
# secrets.RELEASE_APP_PRIVATE_KEY) authenticates the push and is on the
# main branch ruleset bypass list. Production deploys trigger only for
# packages this run actually tagged.
#
# Loop skip is by commit message, not actor: the App's non-release commits
# (if any) still run this workflow; only `[skip ci]` / `chore(release):`
# skip it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      # Placeholders so `pnpm openapi:export` (Prisma generate) can run after an API bump.
      DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/ci?schema=public'
      DATABASE_URL_UNPOOLED: 'postgresql://ci:ci@127.0.0.1:5432/ci?schema=public'
    steps:
      - name: Require singleton-release App credentials
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "${RELEASE_APP_ID}" ]; then
            echo '::error::Repository variable RELEASE_APP_ID is missing. Set it to the singleton-release GitHub App id. Do not fall back to GITHUB_TOKEN.'
            missing=1
          fi
          if [ -z "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo '::error::Repository secret RELEASE_APP_PRIVATE_KEY is missing. Set it to the singleton-release GitHub App private key. Do not fall back to GITHUB_TOKEN.'
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo 'Release cannot push to main without the singleton-release App. See SETUP.md.'
            exit 1
          fi

      - name: Create singleton-release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Keep the write token out of git config until the push step.
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          slug="${APP_SLUG:-singleton-release}"
          git config user.name "${slug}[bot]"
          git config user.email "${slug}[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        env:
          HUSKY: '0'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Tag push only (does not start other workflows). Never used for HEAD:main.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          output=$(pnpm release:ci)
          echo "$output"
          sha=$(echo "$output" | sed -n 's/^RELEASE_SHA=//p' | tail -n1)
          tags=$(echo "$output" | sed -n 's/^RELEASE_TAGS=//p' | tail -n1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          if echo "$output" | grep -q 'Release commit and tags pushed.'; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile GitHub Releases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          notes_file=$(mktemp)
          trap 'rm -f "$notes_file"' EXIT
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub Release already exists for ${tag}; skipping."
              continue
            fi
            echo "Creating GitHub Release for ${tag}"
            gh release create "$tag" --generate-notes --notes-file /dev/null \
              --verify-tag >"$notes_file" 2>&1 || {
              cat "$notes_file"
              if grep -qiE 'already exists|name already exists' "$notes_file"; then
                echo "GitHub Release raced into existence for ${tag}; treating as success."
                continue
              fi
              echo "Failed to create GitHub Release for ${tag}"
              exit 1
            }
          done < <(node scripts/release-changed.mjs --reconcile-tags)

      - name: Dispatch production deploys
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          sha="${RELEASE_SHA}"
          if [ -z "$sha" ]; then
            echo '::error::RELEASE_SHA is empty after a successful release. Refusing to dispatch deploys.'
            exit 1
          fi
          IFS=',' read -r -a tags <<< "${RELEASE_TAGS}"
          dispatch_if_tagged() {
            local needle="$1"
            local workflow="$2"
            local tag=""
            for candidate in "${tags[@]}"; do
              [ -n "$candidate" ] || continue
              case "$candidate" in
                "${needle}"@*) tag="$candidate"; break ;;
              esac
            done
            if [ -z "$tag" ]; then
              echo "No ${needle} tag this run; skipping ${workflow}."
              return 0
            fi
            echo "Dispatching ${workflow} for ${tag} at ${sha}"
            gh workflow run "$workflow" \
              --ref main \
              -f release_tag="$tag" \
              -f release_sha="$sha"
          }
          dispatch_if_tagged '@poc-plattform-kit/api' deploy-api.yml
          dispatch_if_tagged '@poc-plattform-kit/web' deploy-web.yml
          dispatch_if_tagged '@poc-plattform-kit/marketing' pages.yml
