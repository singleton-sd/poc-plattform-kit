# Path-aware release-it: bump workspace package versions on main.
# Skips when the push is already a release commit (avoids loops).
# After a bump, explicitly workflow_dispatch deploy-api / deploy-web —
# GITHUB_TOKEN pushes do not trigger other workflows (GitHub recursion guard).
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: Release') }}"
    runs-on: ubuntu-latest
    name: Bump package versions
    # Placeholder URL for Prisma generate during openapi:export (no live DB).
    env:
      DATABASE_URL: 'sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release commit and tags pushed' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no release push and not empty)."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch production deploys
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release:ci committed + pushed to origin/main from this working tree.
          # gh workflow run --ref must be a branch or tag name (not a raw SHA).
          git fetch origin main
          HEAD_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Local HEAD ($HEAD_SHA) does not match origin/main ($MAIN_SHA) after release push."
            exit 1
          fi
          mapfile -t files < <(git show --name-only --pretty=format: "$HEAD_SHA")
          echo "Release commit $HEAD_SHA on main — files:"
          printf '%s\n' "${files[@]}"
          dispatch=false
          for f in "${files[@]}"; do
            if [ "$f" = 'apps/api/package.json' ]; then
              echo "Dispatching deploy-api.yml @ main ($HEAD_SHA)"
              gh workflow run deploy-api.yml --ref main
              dispatch=true
            fi
            if [ "$f" = 'apps/web/package.json' ]; then
              echo "Dispatching deploy-web.yml @ main ($HEAD_SHA)"
              gh workflow run deploy-web.yml --ref main
              dispatch=true
            fi
          done
          if [ "$dispatch" = false ]; then
            echo "No apps/api or apps/web package.json in release commit — skipping deploys."
          fi
