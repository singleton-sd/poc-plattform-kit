name: PR review brief

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_run:
    workflows:
      - CI Web
      - CI API
      - Preview Web (Container Apps)
      - Preview Marketing (SWA)
      - Preview API (Container Apps)
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  brief:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-brief-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted brief implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Upsert Human Review Brief
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/upsert-pr-review-brief.mjs ]; then
            echo 'Brief script is being bootstrapped by this PR; skip until merged.'
            exit 0
          fi
          node scripts/upsert-pr-review-brief.mjs --pr "$EVENT_PR"
