name: Playwright Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/playwright.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/playwright.yml'

concurrency:
  group: playwright-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public_journeys:
    name: Playwright public journeys
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @poc-plattform-kit/web exec playwright install --with-deps chromium

      - name: Run public journeys
        run: pnpm --filter @poc-plattform-kit/web run test:e2e

      - name: Upload failure artifacts
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
