name: CI API

# Path filters include this workflow file so edits re-run API CI on PRs.
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'pillars/**'
      - 'packages/**'
      - 'scripts/check-client-changelogs.mjs'
      - 'scripts/check-client-changelogs.test.mjs'
      - 'scripts/client-changelog.mjs'
      - 'scripts/client-changelog.test.mjs'
      - 'scripts/backfill-client-changelogs.mjs'
      - 'scripts/backfill-client-changelogs.test.mjs'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierrc'
      - '.prettierignore'
      - 'eslint.config.js'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'pillars/**'
      - 'packages/**'
      - 'scripts/check-client-changelogs.mjs'
      - 'scripts/check-client-changelogs.test.mjs'
      - 'scripts/client-changelog.mjs'
      - 'scripts/client-changelog.test.mjs'
      - 'scripts/backfill-client-changelogs.mjs'
      - 'scripts/backfill-client-changelogs.test.mjs'
      - '.github/workflows/ci-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierrc'
      - '.prettierignore'
      - 'eslint.config.js'

concurrency:
  group: ci-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Lint / test / build (api)
    runs-on: ubuntu-latest
    env:
      # prisma validate/generate read schema url; no live DB in CI
      DATABASE_URL: 'sqlserver://localhost:1433;database=ci;user=ci;password=ci;encrypt=true;trustServerCertificate=true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: OpenAPI client drift check
        run: pnpm openapi:check

      - name: Changelog projection drift check
        run: pnpm changelog:test && pnpm changelog:check

      - name: Prettier check
        run: pnpm format:check

      - name: Lint (api + pillars + packages)
        run: |
          pnpm --filter @poc-plattform-kit/api... run lint
          pnpm --filter "./pillars/**" run lint
          pnpm exec eslint .

      - name: Test (api + pillars + packages)
        run: |
          pnpm --filter @poc-plattform-kit/api... run test
          pnpm --filter "./pillars/**" run test

      - name: Build (api + pillars + packages)
        run: |
          pnpm --filter @poc-plattform-kit/api... run build
          pnpm --filter "./pillars/**" run build
