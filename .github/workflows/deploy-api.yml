# NestJS → Azure Container Apps Consumption — production deploy on package tag
# push (also manual workflow_dispatch). Version bumps land via release.yml; tag
# push checks out the tagged release commit.
#
# Auth: OIDC Variables only (no publish profile / AZURE_CREDENTIALS in GitHub Secrets).
# Image: apps/api/Dockerfile --target production → ACR pocpk-api:<sha> (+ :latest).
# Host: ssd-pocpk-aca-api-dev-ae on shared CAE ssd-pocpk-cae-dev-ae (same as PR previews).
# ACR push uses OIDC → Key Vault acr-admin-* (same pattern as preview-api.yml).
#
# During dual-run cutover, App Service may still serve the custom domain; this
# workflow deploys/smoke-tests the ACA default hostname. After DNS cutover, set
# repo Variable API_PRODUCTION_BASE_URL to https://api.plattform-kit.poc.singletonsd.com.
#
# If OIDC Variables are missing, deploy SKIP (job succeeds). See SETUP.md / docs/pr-pipelines.md.
name: Deploy API (Container Apps)

on:
  push:
    tags:
      - '@poc-plattform-kit/api@*'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA to deploy (manual dispatch)
        required: false
        type: string

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-poc-plattform-kit
  AZURE_CONTAINER_APP_NAME: ssd-pocpk-aca-api-dev-ae
  ACA_ENV_NAME: ssd-pocpk-cae-dev-ae
  ACR_NAME: ssdpocpkacrdevae
  IMAGE_REPO: pocpk-api
  TARGET_PORT: '3001'
  KEY_VAULT_NAME: ssd-pocpk-kv-dev-ae

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build + Container Apps deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set — skipping Container Apps deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tags
        if: steps.oidc.outputs.configured == 'true'
        id: img
        run: |
          set -euo pipefail
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)
          SHA="${{ inputs.release_sha || github.sha }}"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$LOGIN_SERVER/$IMAGE_REPO:$SHA" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LOGIN_SERVER/$IMAGE_REPO:latest" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        if: steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ACR_USER=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acr-admin-username --query value -o tsv)
          ACR_PASS=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acr-admin-password --query value -o tsv)
          echo "::add-mask::$ACR_PASS"
          echo "$ACR_PASS" | docker login "${{ steps.img.outputs.login_server }}" -u "$ACR_USER" --password-stdin
          docker build -f apps/api/Dockerfile --target production \
            -t "${{ steps.img.outputs.sha_tag }}" \
            -t "${{ steps.img.outputs.latest_tag }}" \
            .
          docker push "${{ steps.img.outputs.sha_tag }}"
          docker push "${{ steps.img.outputs.latest_tag }}"

      - name: Deploy / update production Container App
        if: steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          chmod +x ./infra/deploy-aca-api.sh
          ./infra/deploy-aca-api.sh --image "${{ steps.img.outputs.sha_tag }}"

      - name: Resolve smoke-test base URL
        if: steps.oidc.outputs.configured == 'true'
        id: url
        run: |
          set -euo pipefail
          if [ -n "${{ vars.API_PRODUCTION_BASE_URL }}" ]; then
            echo "base=${{ vars.API_PRODUCTION_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            FQDN=$(az containerapp show \
              -n "$AZURE_CONTAINER_APP_NAME" \
              -g "$AZURE_RESOURCE_GROUP" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "base=https://$FQDN" >> "$GITHUB_OUTPUT"
          fi
          echo "Smoke base: $(cat "$GITHUB_OUTPUT" | grep base=)"

      - name: Verify /health + /health/db
        if: steps.oidc.outputs.configured == 'true'
        env:
          API_BASE_URL: ${{ steps.url.outputs.base }}
          AZURE_CONTAINER_APP_NAME: ${{ env.AZURE_CONTAINER_APP_NAME }}
          VERIFY_TIMEOUT_SEC: '360'
          VERIFY_POLL_SEC: '10'
        run: bash ./scripts/verify-api-containerapp.sh

      - name: Skip notice (OIDC not configured)
        if: steps.oidc.outputs.configured != 'true'
        run: |
          echo "API production deploy skipped — set GitHub Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID."
          echo "Ensure CAE + ACR exist (./infra/deploy-aca-preview.sh) and RG Contributor for ssd-pocpk-gha-oidc-dev."
