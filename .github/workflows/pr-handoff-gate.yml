name: PR handoff gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows:
      - CI Web
      - CI API
      - Preview Web (SWA)
      - Preview Marketing (SWA)
      - Preview API (Container Apps)
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: write

jobs:
  gate:
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    concurrency:
      # A workflow_run can have no associated PR. The job guard skips those
      # events; run_id also prevents an empty key from cancelling useful runs.
      group: pr-handoff-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          PR="$EVENT_PR"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo 'No pull request linked to event' >&2
            exit 1
          fi
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Mark handoff gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context=pr-handoff-gate \
            -f description='Waiting for CI and reviewer quiet period' >/dev/null

      - name: Check out trusted gate implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Wait for stable handoff state
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/pr-handoff-gate.mjs ]; then
            echo 'Gate implementation is being bootstrapped by this PR; defer enforcement until merged.'
            exit 0
          fi
          node scripts/pr-handoff-gate.mjs --pr '${{ steps.pr.outputs.number }}' --timeout-seconds 1200

      - name: Publish handoff gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
          OUTCOME: ${{ steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then
            STATE=success
            DESCRIPTION='CI green, mergeable, and reviewer feedback stable'
          else
            STATE=failure
            DESCRIPTION='PR is not safe to hand off; inspect this run'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" \
            -f context=pr-handoff-gate \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL" >/dev/null
          [ "$STATE" = success ]
