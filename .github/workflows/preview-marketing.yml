# GitHub Pages PR preview for marketing at /pr-preview/pr-<number>/.
# House pattern: singleton-sd/poc-inkads-marketing (rossjrw/pr-preview-action
# onto gh-pages, PREVIEW_BASE_PATH so Astro assets resolve under the subpath).
# Fork PRs are not published (no write access to gh-pages).
#
# Build runs with read-only token (no persisted credentials). Publish is a
# separate trusted job with contents: write that only deploys the artifact.
# Close handling lives in preview-marketing-close.yml (no path filter) so a
# later commit that reverts marketing files still removes the preview.
#
# Secrets: none. Optional Variable PUBLIC_POSTKIT_API_BASE_URL overrides the
# Contact form's baked-in PostKit default. Product app SWA previews stay on
# Container Apps (preview-web.yml).
name: Preview Marketing (GitHub Pages)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'apps/marketing/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/preview-marketing.yml'
      - '.github/workflows/preview-marketing-close.yml'
      - '.github/workflows/pages.yml'

concurrency:
  group: preview-marketing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Build marketing preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build marketing (preview base)
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
          PUBLIC_POSTKIT_API_BASE_URL: ${{ vars.PUBLIC_POSTKIT_API_BASE_URL }}
        run: pnpm --filter @poc-plattform-kit/marketing... run build

      - name: Check asset paths (preview)
        run: node apps/marketing/scripts/check-asset-paths.mjs --dir apps/marketing/dist --base /pr-preview/pr-${{ github.event.number }}/

      - uses: actions/upload-artifact@v4
        with:
          name: marketing-preview-dist
          path: apps/marketing/dist
          retention-days: 1

  publish:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Build + GitHub Pages preview
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # Trusted base ref only — do not execute PR-head build scripts here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: marketing-preview-dist
          path: apps/marketing/dist

      - name: Deploy preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          action: deploy
          comment: false

      - name: Retry deploy preview
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          action: deploy
          comment: false

      - name: Add preview URL comment once
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://plattform-kit.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/
        with:
          script: |
            const marker = '<!-- pages-preview-marketing -->';
            const previewUrl = process.env.PREVIEW_URL;
            const body = [
              marker,
              '### Marketing preview (GitHub Pages)',
              '',
              'Published under the shared `gh-pages` branch (this repo has one Pages site).',
              '',
              `- Preview URL: ${previewUrl}`,
              '- Production host: `https://plattform-kit.poc.singletonsd.com`',
              '',
              '_Astro `base` for this build is `/pr-preview/pr-<number>/`. Decap `/admin` is production-only; do not browse untrusted PR previews while signed into `/admin` (same origin)._',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.some((comment) => comment.body?.includes(marker))) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
