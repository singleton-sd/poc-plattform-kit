# Azure Static Web Apps PR preview for marketing (Free SKU — no extra cost).
# Secrets: NEVER in GitHub Secrets. OIDC → Key Vault `swa-marketing-deployment-token`.
# Required Variables (IDs only): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# If those Variables are missing, deploy steps SKIP (job succeeds) so CI is not blocked forever.
# See SETUP.md / docs/pr-pipelines.md. Touching this file retriggers previews.
name: Preview Marketing (SWA)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/marketing/**'
      - 'scripts/validate-staticwebapp-config.mjs'
      - '.github/workflows/preview-marketing.yml'

concurrency:
  group: preview-marketing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build + marketing SWA preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build marketing
        env:
          PUBLIC_MARKETING_API_BASE_URL: ${{ vars.PUBLIC_MARKETING_API_BASE_URL || 'https://ssd-pocpk-decap-oauth-dev-ae.azurewebsites.net' }}
        run: pnpm --filter @poc-plattform-kit/marketing... run build

      # SWA rejects trailing-slash duplicate routes (e.g. /admin + /admin/).
      - name: Validate SWA config (dist)
        run: node scripts/validate-staticwebapp-config.mjs apps/marketing/dist/staticwebapp.config.json

      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) — skipping marketing SWA deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read marketing SWA deploy token from Key Vault
        if: steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          token=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name swa-marketing-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy marketing SWA preview
        id: deploy
        if: steps.oidc.outputs.configured == 'true' && env.SWA_DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ env.SWA_DEPLOYMENT_TOKEN }}
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          # Astro static build emits the site under apps/marketing/dist
          app_location: apps/marketing/dist
          skip_app_build: true

      - name: Add preview URL to PR body once
        if: steps.oidc.outputs.configured == 'true' && steps.deploy.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- swa-preview-marketing -->';
            const pr = context.issue.number;
            const previewHost = `https://purple-field-05048bf00-${pr}.eastasia.7.azurestaticapps.net`;
            const previewSection = [
              marker,
              '### Marketing preview (SWA Free)',
              '',
              'Static Web Apps created a **PR preview environment** for `apps/marketing`.',
              '',
              `- Preview URL: ${previewHost}`,
              '- Production SWA: `ssd-pocpk-mkt-dev-ae` (Free) — requires `stagingEnvironmentPolicy=Enabled`.',
              '- Deploy token loaded at runtime via **OIDC → Key Vault** (`swa-marketing-deployment-token`).',
              '',
              '_Production host: `https://plattform-kit.poc.singletonsd.com`._',
            ].join('\n');

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pull.body?.includes(marker)) {
              const body = [pull.body?.trim(), previewSection].filter(Boolean).join('\n\n');
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body,
              });
            }

      - name: Skip notice (OIDC not configured)
        if: steps.oidc.outputs.configured != 'true'
        run: |
          echo "Marketing SWA preview skipped — set GitHub Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC IDs only; token stays in Key Vault)."

  close_preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close marketing SWA preview
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set — skipping marketing SWA preview close."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read marketing SWA deploy token from Key Vault
        if: steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          token=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name swa-marketing-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Close Static Web App preview
        if: steps.oidc.outputs.configured == 'true' && env.SWA_DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ env.SWA_DEPLOYMENT_TOKEN }}
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: close

      - name: Skip notice (OIDC not configured)
        if: steps.oidc.outputs.configured != 'true'
        run: echo "Marketing SWA preview close skipped — OIDC Variables not configured."
