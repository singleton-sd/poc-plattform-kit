# GitHub Pages PR preview for marketing at /pr-preview/pr-<number>/.
# House pattern: singleton-sd/poc-inkads-marketing (rossjrw/pr-preview-action
# onto gh-pages, PREVIEW_BASE_PATH so Astro assets resolve under the subpath).
# Fork PRs are not published (no write access to gh-pages).
#
# Secrets: none. Optional Variable PUBLIC_POSTKIT_API_BASE_URL overrides the
# Contact form's baked-in PostKit default. Product app SWA previews stay on
# Container Apps (preview-web.yml).
name: Preview Marketing (GitHub Pages)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'apps/marketing/**'
      - '.github/workflows/preview-marketing.yml'
      - '.github/workflows/pages.yml'

concurrency:
  group: preview-marketing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    name: Build + GitHub Pages preview
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build marketing (preview base)
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
          PUBLIC_POSTKIT_API_BASE_URL: ${{ vars.PUBLIC_POSTKIT_API_BASE_URL }}
        run: pnpm --filter @poc-plattform-kit/marketing... run build

      - name: Check asset paths (preview)
        run: node apps/marketing/scripts/check-asset-paths.mjs --dir apps/marketing/dist --base /pr-preview/pr-${{ github.event.number }}/

      # pr-preview-action is composite; retry once when parallel gh-pages
      # pushes race against production or another preview.
      - name: Deploy preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

      - name: Retry deploy preview
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

      - name: Add preview URL to PR body once
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://plattform-kit.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/
        with:
          script: |
            const marker = '<!-- pages-preview-marketing -->';
            const previewUrl = process.env.PREVIEW_URL;
            const previewSection = [
              marker,
              '### Marketing preview (GitHub Pages)',
              '',
              'Published under the shared `gh-pages` branch (this repo has one Pages site).',
              '',
              `- Preview URL: ${previewUrl}`,
              '- Production host: `https://plattform-kit.poc.singletonsd.com`',
              '',
              '_Astro `base` for this build is `/pr-preview/pr-<number>/`. Decap `/admin` keeps production-absolute paths and is not a preview surface._',
            ].join('\n');

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pull.body?.includes(marker)) {
              const body = [pull.body?.trim(), previewSection].filter(Boolean).join('\n\n');
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body,
              });
            }

  close_preview:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close GitHub Pages preview
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview
        id: remove_preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

      - name: Retry remove preview
        if: steps.remove_preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/marketing/dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
