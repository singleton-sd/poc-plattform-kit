# Azure Static Web Apps PR preview (Free SKU — no extra cost).
# Secrets: NEVER in GitHub Secrets. OIDC → Key Vault `swa-deployment-token`.
# Required Variables (IDs only): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# If those Variables are missing, deploy steps SKIP (job succeeds) so CI is not blocked forever.
# See SETUP.md / docs/pr-pipelines.md. Touching this file retriggers previews.
name: Preview Web (SWA)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/preview-web.yml'
      - 'scripts/entra-spa-preview-redirect.sh'
      - 'scripts/entra-spa-preview-redirect.mjs'

concurrency:
  group: preview-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build + SWA preview
    outputs:
      preview_url: ${{ steps.deploy.outputs.static_web_app_url }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID) — skipping SWA deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve preview API base URL
        id: api_url
        env:
          FALLBACK_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.plattform-kit.poc.singletonsd.com' }}
        run: |
          set -euo pipefail
          APP_NAME="ssd-pocpk-aca-pr-${{ github.event.pull_request.number }}-ae"
          FQDN=""
          if [ "${{ steps.oidc.outputs.configured }}" = "true" ]; then
            # This PR's own API preview (see preview-api.yml) may not exist yet
            # (still deploying, or the PR doesn't touch apps/api|pillars) — that
            # is not an error here, just fall back below.
            FQDN=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group rg-poc-plattform-kit \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
          fi
          if [ -n "$FQDN" ]; then
            echo "Using this PR's own API preview: https://$FQDN"
            echo "base_url=https://$FQDN" >> "$GITHUB_OUTPUT"
          else
            echo "No API preview found for $APP_NAME (or OIDC not configured) — falling back to $FALLBACK_API_BASE_URL"
            echo "base_url=$FALLBACK_API_BASE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web
        env:
          # Baked into the static export; SWA runtime cannot inject this later.
          # Resolved above: this PR's own ACA API preview when available (see
          # preview-api.yml), else the production API as a fallback — a static
          # NEXT_PUBLIC_API_BASE_URL Variable can never be right per-PR since
          # the ACA preview hostname is per-PR-number.
          # Option B cookies on custom domains; MSAL Bearer on *.azurestaticapps.net.
          # Rebuild after setting GitHub Variables NEXT_PUBLIC_AZURE_AD_* (MSAL).
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.api_url.outputs.base_url }}
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}
          NEXT_PUBLIC_AZURE_AD_API_SCOPE: ${{ vars.NEXT_PUBLIC_AZURE_AD_API_SCOPE }}
        run: pnpm --filter @poc-plattform-kit/web... run build

      - name: Read SWA deploy token from Key Vault
        if: steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          token=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name swa-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy SWA preview
        id: deploy
        if: steps.oidc.outputs.configured == 'true' && env.SWA_DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ env.SWA_DEPLOYMENT_TOKEN }}
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          # Next `output: 'export'` emits the runnable site under apps/web/out
          # (public/ assets are copied there). Deploy the export, not public/.
          app_location: apps/web/out
          skip_app_build: true

      - name: Add preview URL to PR body once
        if: steps.oidc.outputs.configured == 'true' && steps.deploy.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- swa-preview-web -->';
            const deployUrl = '${{ steps.deploy.outputs.static_web_app_url }}';
            const previewSection = [
              marker,
              '### Web preview (SWA Free)',
              '',
              'Static Web Apps created a **PR preview environment** for `apps/web`.',
              '',
              deployUrl ? `- Preview URL: ${deployUrl}` : '- Preview URL was not returned by the deployment action.',
              '- Production SWA: `pocpk-web-si5fhs6dvxiha` (Free) — PR previews are included.',
              '- Deploy token loaded at runtime via **OIDC → Key Vault** (`swa-deployment-token`).',
              '- Entra SPA redirect URI registered for MSAL (see `scripts/entra-spa-preview-redirect.sh`).',
              '',
              '_API is not deployed here. See `preview-api.yml` / SETUP.md (Path B ACA)._',
            ].join('\n');

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (!pull.body?.includes(marker)) {
              const body = [pull.body?.trim(), previewSection].filter(Boolean).join('\n\n');
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body,
              });
            }

      - name: Skip notice (OIDC not configured)
        if: steps.oidc.outputs.configured != 'true'
        run: |
          echo "SWA preview skipped — set GitHub Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC IDs only; token stays in Key Vault)."

  register_entra_redirect:
    if: github.event.action != 'closed' && needs.build_and_preview.result == 'success'
    needs: build_and_preview
    concurrency:
      group: entra-spa-preview-redirects
      cancel-in-progress: false
    runs-on: ubuntu-latest
    name: Register Entra redirect
    permissions:
      contents: read
      id-token: write
    steps:
      # Use only code from the trusted base on this credentialed runner.
      - name: Check out trusted redirect helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/entra-spa-preview-redirect.sh
            scripts/entra-spa-preview-redirect.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set — skipping Entra redirect registration."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # MSAL uses window.location.origin; Entra has no SWA host wildcards.
      - name: Register Entra SPA redirect URI for preview
        if: steps.oidc.outputs.configured == 'true'
        env:
          ENTRA_SPA_APP_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/entra-spa-preview-redirect.sh ]; then
            echo "warning: trusted base does not contain the redirect helper yet; skipping"
            exit 0
          fi
          chmod +x scripts/entra-spa-preview-redirect.sh
          origin="${{ needs.build_and_preview.outputs.preview_url }}"
          args=(add --pr "${{ github.event.pull_request.number }}")
          if [ -n "$origin" ]; then
            args+=(--origin "$origin")
          fi
          scripts/entra-spa-preview-redirect.sh "${args[@]}"

  close_preview:
    if: github.event.action == 'closed'
    concurrency:
      group: entra-spa-preview-redirects
      cancel-in-progress: false
    runs-on: ubuntu-latest
    name: Close SWA preview
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted redirect helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/entra-spa-preview-redirect.sh
            scripts/entra-spa-preview-redirect.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set — skipping SWA preview close."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove Entra SPA redirect URI for preview
        if: steps.oidc.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
          ENTRA_SPA_APP_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/entra-spa-preview-redirect.sh ]; then
            echo "warning: trusted base does not contain the redirect helper yet; skipping"
            exit 0
          fi
          chmod +x scripts/entra-spa-preview-redirect.sh
          # Resolve hostname while the SWA environment still exists, then remove URI.
          scripts/entra-spa-preview-redirect.sh remove \
            --pr "${{ github.event.pull_request.number }}"

      - name: Read SWA deploy token from Key Vault
        if: steps.oidc.outputs.configured == 'true'
        run: |
          set -euo pipefail
          token=$(az keyvault secret show \
            --vault-name ssd-pocpk-kv-dev-ae \
            --name swa-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$token"
          echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Close Static Web App preview
        if: steps.oidc.outputs.configured == 'true' && env.SWA_DEPLOYMENT_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ env.SWA_DEPLOYMENT_TOKEN }}
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: close

      - name: Skip notice (OIDC not configured)
        if: steps.oidc.outputs.configured != 'true'
        run: echo "SWA preview close skipped — OIDC Variables not configured."
