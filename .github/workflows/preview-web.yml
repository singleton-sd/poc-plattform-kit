# Web PR preview — Azure Container Apps Consumption (same Path B pattern as
# preview-api.yml). Production web stays on SWA Free via deploy-web.yml.
#
# Per-PR ephemeral app: ssd-pocpk-aca-web-pr-<n>-ae (scale to zero).
# Do not reuse ssd-pocpk-aca-pr-<n>-ae (API previews).
#
# Secrets: NEVER in GitHub Secrets. OIDC → Key Vault `acr-admin-*`.
# Required Variables (IDs only): AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID. Missing Variables fail this workflow (same as
# preview-api.yml) so a skip cannot look like a successful preview.
#
# See SETUP.md / docs/pr-pipelines.md. Touching this file retriggers previews.
name: Preview Web (Container Apps)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/preview-web.yml'
      - 'scripts/entra-spa-preview-redirect.sh'
      - 'scripts/entra-spa-preview-redirect.mjs'
      - 'scripts/should-run-web-preview.mjs'
      - 'scripts/should-run-web-preview.test.mjs'

env:
  AZURE_RESOURCE_GROUP: rg-poc-plattform-kit
  ACA_ENV_NAME: ssd-pocpk-cae-dev-ae
  ACR_NAME: ssdpocpkacrdevae
  IMAGE_REPO: pocpk-web
  TARGET_PORT: '80'
  KEY_VAULT_NAME: ssd-pocpk-kv-dev-ae

jobs:
  build_and_preview:
    name: Build and deploy web ACA preview
    # Require open state (not only action != closed) so a late synchronize
    # cannot recreate the app after cleanup on a closed/merged PR.
    if: github.event.pull_request.state == 'open'
    concurrency:
      group: preview-web-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
      should_run: ${{ steps.filter.outputs.should_run }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: List changed files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            fs.writeFileSync('changed-files.txt', files.map((f) => f.filename).join('\n'));

      - name: Filter unit tests
        run: node --test scripts/should-run-web-preview.test.mjs

      - name: Decide whether to run web preview
        id: filter
        run: |
          set -euo pipefail
          should_run=$(node scripts/should-run-web-preview.mjs --changed-files=changed-files.txt)
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          if [ "$should_run" = "true" ]; then
            echo "Web-preview-relevant non-generated changes detected — continuing ACA build/deploy."
          else
            echo "Only generated api-client OpenAPI/Orval files (or no web-preview paths) changed — skipping ACA build/deploy."
          fi

      - name: Skip notice (generated-only)
        if: steps.filter.outputs.should_run != 'true'
        run: |
          echo "Web ACA preview skipped — changes are limited to packages/api-client/openapi.json and/or packages/api-client/src/generated/** (or no preview-web path matches). See scripts/should-run-web-preview.mjs."

      - name: Confirm PR still open
        if: steps.filter.outputs.should_run == 'true'
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .state)
          if [ "$state" = "open" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR is '$state' — skipping web ACA deploy to avoid orphaned preview after close."
          fi

      - name: Require Azure OIDC Variables
        if: steps.filter.outputs.should_run == 'true' && steps.open.outputs.open == 'true'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AZURE_CLIENT_ID}" ]; then
            echo "::error::Missing GitHub Variable AZURE_CLIENT_ID. Web previews require OIDC only (AZURE_CREDENTIALS is not supported)."
            missing=1
          fi
          if [ -z "${AZURE_TENANT_ID}" ]; then
            echo "::error::Missing GitHub Variable AZURE_TENANT_ID. Web previews require OIDC only (AZURE_CREDENTIALS is not supported)."
            missing=1
          fi
          if [ -z "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "::error::Missing GitHub Variable AZURE_SUBSCRIPTION_ID. Web previews require OIDC only (AZURE_CREDENTIALS is not supported)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure federated OIDC for this repo and set Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. See docs/pr-pipelines.md."
            exit 1
          fi

      - name: Azure login (OIDC)
        if: steps.filter.outputs.should_run == 'true' && steps.open.outputs.open == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        if: steps.filter.outputs.should_run == 'true' && steps.open.outputs.open == 'true'
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "image=$LOGIN_SERVER/$IMAGE_REPO:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          APP_NAME="ssd-pocpk-aca-web-pr-${{ github.event.pull_request.number }}-ae"
          if [ ${#APP_NAME} -gt 32 ]; then
            echo "Container App name exceeds 32 chars: $APP_NAME" >&2
            exit 1
          fi
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve preview API base URL
        id: api_url
        if: steps.filter.outputs.should_run == 'true' && steps.open.outputs.open == 'true'
        env:
          FALLBACK_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.plattform-kit.poc.singletonsd.com' }}
        run: |
          set -euo pipefail
          API_APP_NAME="ssd-pocpk-aca-pr-${{ github.event.pull_request.number }}-ae"
          FQDN=$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
          if [ -n "$FQDN" ]; then
            echo "Using this PR's own API preview: https://$FQDN"
            echo "base_url=https://$FQDN" >> "$GITHUB_OUTPUT"
          else
            echo "No API preview found for $API_APP_NAME — falling back to $FALLBACK_API_BASE_URL"
            echo "base_url=$FALLBACK_API_BASE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.filter.outputs.should_run == 'true' && steps.open.outputs.open == 'true'
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.api_url.outputs.base_url }}
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}
          NEXT_PUBLIC_AZURE_AD_API_SCOPE: ${{ vars.NEXT_PUBLIC_AZURE_AD_API_SCOPE }}
        run: |
          set -euo pipefail
          ACR_USER=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acr-admin-username --query value -o tsv)
          ACR_PASS=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acr-admin-password --query value -o tsv)
          echo "::add-mask::$ACR_PASS"
          echo "$ACR_PASS" | docker login "${{ steps.acr.outputs.login_server }}" -u "$ACR_USER" --password-stdin
          docker build -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL" \
            --build-arg "NEXT_PUBLIC_AZURE_AD_CLIENT_ID=$NEXT_PUBLIC_AZURE_AD_CLIENT_ID" \
            --build-arg "NEXT_PUBLIC_AZURE_AD_TENANT_ID=$NEXT_PUBLIC_AZURE_AD_TENANT_ID" \
            --build-arg "NEXT_PUBLIC_AZURE_AD_API_SCOPE=$NEXT_PUBLIC_AZURE_AD_API_SCOPE" \
            -t "${{ steps.acr.outputs.image }}" \
            -t "${{ steps.acr.outputs.login_server }}/$IMAGE_REPO:pr-${{ github.event.pull_request.number }}-${{ github.sha }}" \
            .
          docker push "${{ steps.acr.outputs.image }}"
          docker push "${{ steps.acr.outputs.login_server }}/$IMAGE_REPO:pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

      - name: Deploy ephemeral Container App
        if: steps.filter.outputs.should_run == 'true' && steps.open.outputs.open == 'true'
        id: deploy
        env:
          APP_NAME: ${{ steps.acr.outputs.app_name }}
          IMAGE: ${{ steps.acr.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .state)
          if [ "$state" != "open" ]; then
            echo "::notice::PR is '$state' before ACA mutate — skipping deploy to avoid recreate-after-cleanup."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          ACR_USER=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acr-admin-username --query value -o tsv)
          ACR_PASS=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acr-admin-password --query value -o tsv)
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"

          EXISTS=$(az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" --query name -o tsv 2>/dev/null || true)
          if [ -z "$EXISTS" ]; then
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$ACA_ENV_NAME" \
              --workload-profile-name Consumption \
              --image "$IMAGE" \
              --target-port "$TARGET_PORT" \
              --ingress external \
              --registry-server "$LOGIN_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --cpu 0.25 --memory 0.5Gi \
              --min-replicas 0 --max-replicas 1 \
              --env-vars "PORT=$TARGET_PORT" \
              --tags "project=poc-plattform-kit" "purpose=pr-preview-web" "pr=${{ github.event.pull_request.number }}"
          else
            az containerapp registry set \
              --name "$APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$LOGIN_SERVER" \
              --username "$ACR_USER" \
              --password "$ACR_PASS"
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$IMAGE" \
              --min-replicas 0 --max-replicas 1
          fi

          FQDN=$(az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke preview GET /
        if: >
          steps.filter.outputs.should_run == 'true' &&
          steps.open.outputs.open == 'true' &&
          steps.deploy.outcome == 'success' &&
          steps.deploy.outputs.skipped != 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          APP_NAME: ${{ steps.acr.outputs.app_name }}
        run: |
          set -euo pipefail
          # nginx static export; Consumption scale-from-zero + image pull can take several minutes.
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/web-preview-body.txt -w "%{http_code}" --max-time 25 \
              "${PREVIEW_URL}/" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Preview GET / OK (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — waiting for replica"
            sleep 10
          done
          echo "::error::Preview ${PREVIEW_URL}/ did not return 200 within ~6m"
          az containerapp logs show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --type console --tail 80 || true
          az containerapp replica list -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" -o json || true
          exit 1

      - name: Comment preview URL on PR
        if: >
          steps.filter.outputs.should_run == 'true' &&
          steps.open.outputs.open == 'true' &&
          steps.deploy.outcome == 'success' &&
          steps.deploy.outputs.skipped != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          APP_NAME: ${{ steps.acr.outputs.app_name }}
          IMAGE_REF: ${{ steps.acr.outputs.image }}
        with:
          script: |
            const marker = '<!-- web-preview-aca -->';
            const url = process.env.PREVIEW_URL;
            const app = process.env.APP_NAME;
            const image = process.env.IMAGE_REF;
            const body = [
              marker,
              '### Web preview (Container Apps Consumption)',
              '',
              `**Preview URL:** ${url}`,
              '',
              `- App: \`${app}\` (scale-to-zero)`,
              `- Image: \`${image}\``,
              '- Path B: ephemeral ACA per PR — not SWA Free staging (3-slot cap)',
              '- Production web remains SWA Free via `deploy-web.yml`',
              '- Cleanup runs when this PR is closed',
              '',
              'Auth on this host is MSAL Bearer (see `docs/sso.md`). Entra SPA redirect is registered after deploy.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  register_entra_redirect:
    if: >
      github.event.pull_request.state == 'open' &&
      needs.build_and_preview.result == 'success' &&
      needs.build_and_preview.outputs.should_run == 'true' &&
      needs.build_and_preview.outputs.preview_url != ''
    needs: build_and_preview
    concurrency:
      group: entra-spa-preview-redirects
      cancel-in-progress: false
    runs-on: ubuntu-latest
    name: Register Entra redirect
    permissions:
      contents: read
      id-token: write
    steps:
      # Use only code from the trusted base on this credentialed runner.
      - name: Check out trusted redirect helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/entra-spa-preview-redirect.sh
            scripts/entra-spa-preview-redirect.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check OIDC Variables
        id: oidc
        run: |
          set -euo pipefail
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC Variables not set — skipping Entra redirect registration."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.oidc.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # MSAL uses window.location.origin; Entra has no ACA host wildcards.
      - name: Register Entra SPA redirect URI for preview
        if: steps.oidc.outputs.configured == 'true'
        env:
          ENTRA_SPA_APP_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/entra-spa-preview-redirect.sh ]; then
            echo "warning: trusted base does not contain the redirect helper yet; skipping"
            exit 0
          fi
          chmod +x scripts/entra-spa-preview-redirect.sh
          origin="${{ needs.build_and_preview.outputs.preview_url }}"
          args=(add --pr "${{ github.event.pull_request.number }}")
          if [ -n "$origin" ]; then
            args+=(--origin "$origin")
          fi
          scripts/entra-spa-preview-redirect.sh "${args[@]}"

  close_preview:
    if: github.event.action == 'closed'
    concurrency:
      group: preview-web-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    name: Delete web ACA preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Check out trusted redirect helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/entra-spa-preview-redirect.sh
            scripts/entra-spa-preview-redirect.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Azure OIDC Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AZURE_CLIENT_ID}" ]; then
            echo "::error::Missing GitHub Variable AZURE_CLIENT_ID. Web previews require OIDC only (AZURE_CREDENTIALS is not supported)."
            missing=1
          fi
          if [ -z "${AZURE_TENANT_ID}" ]; then
            echo "::error::Missing GitHub Variable AZURE_TENANT_ID. Web previews require OIDC only (AZURE_CREDENTIALS is not supported)."
            missing=1
          fi
          if [ -z "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "::error::Missing GitHub Variable AZURE_SUBSCRIPTION_ID. Web previews require OIDC only (AZURE_CREDENTIALS is not supported)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure federated OIDC for this repo and set Variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. See docs/pr-pipelines.md."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove Entra SPA redirect URI for preview
        env:
          APP_NAME: ssd-pocpk-aca-web-pr-${{ github.event.pull_request.number }}-ae
          ENTRA_SPA_APP_ID: ${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/entra-spa-preview-redirect.sh ]; then
            echo "warning: trusted base does not contain the redirect helper yet; skipping Entra remove"
            exit 0
          fi
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
          if [ -z "$FQDN" ]; then
            echo "No app $APP_NAME — skipping Entra remove (orphan sweep will drop leftover URIs)"
            exit 0
          fi
          chmod +x scripts/entra-spa-preview-redirect.sh
          scripts/entra-spa-preview-redirect.sh remove \
            --pr "${{ github.event.pull_request.number }}" \
            --origin "https://$FQDN"

      - name: Delete Container App
        env:
          APP_NAME: ssd-pocpk-aca-web-pr-${{ github.event.pull_request.number }}-ae
        run: |
          EXISTS=$(az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" --query name -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            az containerapp delete -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" --yes
            echo "Deleted $APP_NAME"
          else
            echo "No app $APP_NAME to delete"
          fi

      - name: Delete ACR tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(
            az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$IMAGE_REPO" \
              -o tsv 2>/dev/null | tr -d '\r' || true
          )
          for tag in "${TAGS[@]:-}"; do
            [ -n "$tag" ] || continue
            case "$tag" in
              "pr-${PR_NUMBER}"|"pr-${PR_NUMBER}"-*)
                if az acr repository delete \
                  --name "$ACR_NAME" \
                  --image "${IMAGE_REPO}:${tag}" \
                  --yes; then
                  echo "Deleted ${IMAGE_REPO}:${tag}"
                else
                  echo "WARN failed to delete ${IMAGE_REPO}:${tag} (may already be gone)"
                fi
                ;;
            esac
          done

      - name: Comment cleanup on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- web-preview-aca -->';
            const app = `ssd-pocpk-aca-web-pr-${context.issue.number}-ae`;
            const body = [
              marker,
              '### Web preview (Container Apps Consumption)',
              '',
              `Ephemeral app \`${app}\` was **deleted** on PR close.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
